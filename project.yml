name: Scout
options:
  bundleIdPrefix: dev.scout
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: 1
    CODE_SIGNING_ALLOWED: false
    GENERATE_INFOPLIST_FILE: true
targets:
  ScoutKit:
    type: framework
    platform: iOS
    sources: [Sources/ScoutKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.scout.kit
        DEFINES_MODULE: true
        SKIP_INSTALL: false
        DYLIB_INSTALL_NAME_BASE: '@rpath'
        INFOPLIST_KEY_CFBundleDisplayName: ScoutKit
  ScoutHarness:
    type: application
    platform: iOS
    sources: [Harness]
    dependencies:
    - target: ScoutKit
      embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.scout.harness
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Generate timed lyrics from your audio on this iPhone.
    info:
      path: Config/Harness-Info.plist
      properties:
        ScoutHost: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
  ScoutKitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/ScoutKitTests]
    dependencies:
    - target: ScoutHarness
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ScoutHarness.app/ScoutHarness"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ScoutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/ScoutUITests]
    dependencies:
    - target: ScoutHarness
    settings:
      base:
        TEST_TARGET_NAME: ScoutHarness
schemes:
  ScoutHarness:
    build:
      targets:
        ScoutHarness: all
    test:
      targets: [ScoutKitTests, ScoutUITests]
